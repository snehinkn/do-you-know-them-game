    <title>Do You Know Them</title>

    <!-- Three faces, each with a narrow job:
           Archivo Black   the shouting one - questions, headlines, ledger titles,
                           badge names, verdicts, buttons. Always uppercase.
           Courier Prime   every label, figure, status line and case number.
           Archivo         running sentences and the italic voice lines.

         Cormorant Garamond and Lora were loaded while the gold half of the
         design bundle was being followed. That half is out - Snehin's call on
         24 August was red and Archivo Black throughout - so both serifs come
         out with it. Three families instead of five is also the right number to
         be pulling down on a phone at a party.

         If these fail to load the app falls back to system fonts - plainer,
         but nothing breaks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
